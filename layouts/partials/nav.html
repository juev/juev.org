{{- $pages := where site.RegularPages "Section" .Section -}}
<div class="pagination">
    {{- with .PrevInSection }}
    <p class="previous"><span class="pagination-label">Предыдущая:</span> <a rel="prev" href="{{.Permalink}}" title="{{ .Title }}">{{ .Title }}</a></p>
    {{ end -}}
	{{- with .NextInSection }}
    <p class="next"><span class="pagination-label">Следующая:</span> <a rel="next" href="{{.Permalink}}" title="{{ .Title }}">{{ .Title }}</a></p>
    {{ end -}}
</div>
